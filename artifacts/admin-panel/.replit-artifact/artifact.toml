kind = "web"
previewPath = "/"
title = "PackSMP Admin Panel"
description = "Password-protected web admin panel for the PackSMP Minecraft↔Discord bridge system. Allows administrators to monitor system status (Discord bot, Minecraft bot, RCON), manage verified accounts, view private message logs, browse chat and system logs, change system configuration, and execute admin commands — all from a single dashboard."
version = "1.0.0"
id = "artifacts/admin-panel"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20130

[services.development]
run = "pnpm --filter @workspace/admin-panel run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/admin-panel", "run", "build" ]
serve = "static"
publicDir = "artifacts/admin-panel/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20130"
BASE_PATH = "/"
