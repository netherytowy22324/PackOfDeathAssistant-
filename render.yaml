services:
  - type: web
    name: packsmp-discord-api
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/db run push && pnpm --filter @workspace/api-server run prod
    healthCheckPath: /api/healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: DISCORD_BOT_ENABLED
        value: "true"
      - key: MC_BOT_ENABLED
        value: "false"
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
        # Admin-panel JWT signing secret.
      - key: JWT_SECRET
        sync: false
      - key: DISCORD_CHAT_CHANNEL_ID
        sync: false
      - key: DISCORD_VERIFY_ROLE_ID
        sync: false